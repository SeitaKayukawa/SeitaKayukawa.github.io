name: Validate site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --trace --strict_front_matter
      - name: Validate generated pages and local links
        run: node scripts/check-site.mjs
      - name: Validate canonical URLs and migration behavior
        run: node scripts/check-migration.mjs
