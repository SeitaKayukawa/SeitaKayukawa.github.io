<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="robots" content="noindex">
    <title>{{ page.title | default: 'BibTeX' | escape }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/css/accessibility.css' | relative_url }}">
    <link href="https://fonts.googleapis.com/css?family=Fira+Mono&amp;display=swap" rel="stylesheet">
  </head>
  <body>
    {% include skip-link.html %}
    <main id="main-content" tabindex="-1" style="font-family: 'Fira Mono', monospace;">
      <h1 class="visually-hidden">{{ page.title | default: 'BibTeX' | escape }}</h1>
      {{ content }}
    </main>
  </body>
</html>
