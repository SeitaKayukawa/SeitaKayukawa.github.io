<head>
  <meta charset="UTF-8">
  {% include legacy-redirect-head.html %}
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title | default: site.title | escape }}</title>

  <meta property="og:site_name" content="Seita Kayukawa">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:type" content="{{ page.og_type | default: 'article' }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@_wotipati_">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.og_image | default: '/img/OGP_image.png' | absolute_url }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% if page.not_found %}<meta name="robots" content="noindex">{% endif %}

  <link rel="icon" href="{{ '/img/icon/web_icon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/bootstrap.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/normalize.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/accessibility.css' | relative_url }}">
  <link rel="stylesheet" href="{{ page.stylesheet | default: '/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/sidebar.css' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Fira+Sans:400,500&amp;display=swap" rel="stylesheet">
  <script>
    (function(d) {
      var config = {
        kitId: '{{ page.typekit_id | default: "ehe2scb" }}',
        scriptTimeout: 3000,
        async: true
      },
      h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
    })(document);
  </script>
</head>
