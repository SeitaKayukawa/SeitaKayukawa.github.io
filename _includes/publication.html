{% assign publication = include.publication %}
<div class="{% if publication.language == 'ja' %}pub_js{% else %}pub_en{% endif %}">
  <div>
    {{ publication.citation_html }}
  </div>
  <div>
    {% for resource in publication.resources %}
      {% include resource-label.html resource=resource %}
    {% endfor %}
  </div>
</div>
